<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f0c">
<title>和美高中研習行事曆</title>
<meta name="description" content="和美高中教師與學生研習、活動資訊，依報名截止日整理。">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f0c;
    --card: #0f1612;
    --line: #1f3326;
    --green: #4ade80;
    --green-dim: #2f9e5a;
    --text: #d1e7d6;
    --muted: #8aa595;
    --amber: #fbbf24;
    --amber-soft: #2a2110;
    --cyan: #67e8f9;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono", monospace;
    --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 var(--sans);
  }
  ::selection { background: var(--green); color: var(--bg); }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 48px; }
  .mono { font-family: var(--mono); }

  header .path { font-family: var(--mono); font-size: .85rem; color: var(--green-dim); margin-bottom: 2px; }
  header h1 { font-size: 1.45rem; margin: 0 0 4px; color: var(--green); font-weight: 700; }
  header h1::after {
    content: "_"; margin-left: 4px; color: var(--green);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { header h1::after { animation: none; } }
  header p { margin: 0; color: var(--muted); font: .85rem/1.5 var(--mono); }
  header p::before { content: "# "; color: var(--green-dim); }

  .controls {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0 10px;
    border-bottom: 1px dashed var(--line);
    display: grid; gap: 10px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1 1 220px; min-width: 0; display: flex; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
  }
  .search:focus-within { border-color: var(--green); }
  .search::before { content: ">"; font-family: var(--mono); color: var(--green); padding: 0 0 0 12px; }
  input[type=search] {
    flex: 1; min-width: 0; padding: 10px 12px 10px 8px; font: inherit; color: var(--text);
    background: none; border: 0; outline: none; caret-color: var(--green);
  }
  input[type=search]::placeholder { color: #5d7566; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--card); color: var(--muted); font: .95rem var(--mono);
    padding: 9px 14px; cursor: pointer;
  }
  .seg button[aria-pressed=true] { background: var(--green); color: var(--bg); font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: none; color: var(--muted);
    border-radius: 4px; padding: 2px 9px; font: .82rem var(--mono); cursor: pointer;
  }
  .chip::before { content: "#"; color: var(--green-dim); }
  .chip[aria-pressed=true] { border-color: var(--green); color: var(--green); }

  h2 { font: 700 1rem var(--mono); margin: 28px 0 10px; color: var(--green); display: flex; align-items: baseline; gap: 8px; }
  h2::before { content: "##"; color: var(--green-dim); }
  h2 small { color: var(--muted); font-weight: normal; font-size: .82rem; }
  h2 small::before { content: "("; } h2 small::after { content: ")"; }
  h2.urgent, h2.urgent::before { color: var(--amber); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 4px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .card.closing { border-color: #4a3a12; border-left: 3px solid var(--amber); }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; font: .78rem var(--mono); }
  .badge { color: var(--green); }
  .badge::before { content: "["; color: var(--green-dim); } .badge::after { content: "]"; color: var(--green-dim); }
  .badge.student { color: var(--cyan); }
  .badge.new { color: var(--amber); }
  .badge.plain { color: var(--muted); }
  .card h3 { font-size: 1.05rem; margin: 2px 0 4px; line-height: 1.45; color: #ecf7ef; }
  .summary { margin: 0 0 8px; color: var(--muted); font-size: .92rem; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0 0 12px; font-size: .9rem; }
  dt { color: var(--green-dim); font-family: var(--mono); font-size: .82rem; padding-top: 2px; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .countdown { font-family: var(--mono); }
  .countdown.urgent { color: var(--amber); font-weight: 700; }
  .countdown.urgent::before { content: "[!] "; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a, .actions button {
    font: .85rem var(--mono); text-decoration: none; cursor: pointer;
    padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line);
    background: none; color: var(--text);
  }
  .actions a:hover { border-color: var(--green); color: var(--green); }
  .actions a.primary { background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 700; }
  .actions a.primary:hover { background: #86efac; color: var(--bg); }
  .copy { border: 0; background: none; color: var(--green); font: .8rem var(--mono); cursor: pointer; padding: 0 6px; }
  .copy::before { content: "["; } .copy::after { content: "]"; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .empty, .status { color: var(--muted); text-align: center; padding: 32px 0; font-family: var(--mono); }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; border-top: 1px dashed var(--line); padding-top: 12px; }
  footer::before { content: "// "; color: var(--green-dim); font-family: var(--mono); }
  @media (max-width: 520px) {
    header h1 { font-size: 1.25rem; }
    .seg button { padding: 8px 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="path">~/hmjh/研習 $ ls --sort=deadline</div>
    <h1>和美高中研習行事曆</h1>
    <p id="updated">載入中…</p>
  </header>

  <div class="controls">
    <div class="row">
      <label class="search"><input type="search" id="q" placeholder="搜尋名稱、主辦、地點、課程代碼" aria-label="搜尋"></label>
      <div class="seg" role="group" aria-label="對象">
        <button type="button" data-aud="teacher">教師</button>
        <button type="button" data-aud="student">學生</button>
        <button type="button" data-aud="all">全部</button>
      </div>
    </div>
    <div class="chips" id="tags"></div>
  </div>

  <main id="list"><p class="status">載入中…</p></main>

  <footer>
    資訊由 AI 從公文整理，日期、名額與報名方式請以公文為準。
    發現錯誤請告知資訊組。
  </footer>
</div>

<script>
(function () {
  const CLOSING_DAYS = 7;
  const NEW_DAYS = 7;
  const MODE = { online: '線上', onsite: '實體', hybrid: '實體／線上' };
  const AUD = { teacher: '教師', student: '學生' };
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  const state = { events: [], q: '', aud: 'teacher', tag: '' };
  const $ = id => document.getElementById(id);

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
  }

  function today() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date());
  }

  function days(from, to) {
    return Math.round((Date.parse(to) - Date.parse(from)) / 86400000);
  }

  function fmt(ymd) {
    if (!ymd) return '';
    const [y, m, d] = ymd.split('-').map(Number);
    const w = WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
    return `${m}/${d}（${w}）`;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function dateText(e) {
    if (!e.start) return '日期請見公文';
    let text = fmt(e.start);
    if (e.end && e.end !== e.start) text += ` – ${fmt(e.end)}`;
    if (e.start_time) text += ` ${e.start_time}${e.end_time ? '–' + e.end_time : ''}`;
    return text;
  }

  function countdown(deadline, t) {
    if (!deadline) return '';
    const n = days(t, deadline);
    const label = n <= 0 ? '今天截止' : n === 1 ? '明天截止' : `還有 ${n} 天`;
    return `<span class="countdown ${n <= CLOSING_DAYS ? 'urgent' : ''}">${fmt(deadline)}（${label}）</span>`;
  }

  function calendarUrl(e) {
    const compact = s => s.replace(/-/g, '');
    let dates;
    if (e.start_time) {
      const endDay = e.end || e.start;
      const endTime = e.end_time || e.start_time;
      dates = `${compact(e.start)}T${e.start_time.replace(':', '')}00/${compact(endDay)}T${endTime.replace(':', '')}00`;
    } else {
      const last = new Date(Date.parse(e.end || e.start) + 86400000).toISOString().slice(0, 10);
      dates = `${compact(e.start)}/${compact(last)}`;
    }
    const details = [e.summary, e.course_code ? `課程代碼：${e.course_code}` : '', e.signup_url ? `報名：${e.signup_url}` : '', `公文：${e.pdf}`]
      .filter(Boolean).join('\n');
    const params = new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates: dates, details: details, location: e.location || '', ctz: 'Asia/Taipei' });
    return `https://calendar.google.com/calendar/render?${params}`;
  }

  function card(e, t, closing) {
    const badges = [`<span class="badge ${e.audience}">${AUD[e.audience] || ''}</span>`];
    if (e.mode) badges.push(`<span class="badge plain">${MODE[e.mode]}</span>`);
    if (e.hours) badges.push(`<span class="badge plain">${esc(e.hours)} 小時</span>`);
    if (e.added && days(e.added, t) < NEW_DAYS) badges.push('<span class="badge new">新進</span>');
    e.tags.forEach(tag => badges.push(`<span class="badge plain">${esc(tag)}</span>`));

    const rows = [['日期', esc(dateText(e))]];
    if (e.deadline) rows.push(['報名截止', countdown(e.deadline, t)]);
    if (e.location) rows.push(['地點', esc(e.location)]);
    if (e.host) rows.push(['主辦', esc(e.host)]);
    if (e.course_code) rows.push(['課程代碼', `${esc(e.course_code)}<button class="copy" data-copy="${esc(e.course_code)}">複製</button>`]);

    const actions = [];
    if (e.signup_url) actions.push(`<a class="primary" href="${esc(e.signup_url)}" target="_blank" rel="noopener">報名</a>`);
    actions.push(`<a ${e.signup_url ? '' : 'class="primary"'} href="${esc(e.pdf)}" target="_blank" rel="noopener">公文 PDF</a>`);
    e.attachments.forEach(a => actions.push(`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(shortName(a.name))}</a>`));
    if (e.start) actions.push(`<a href="${esc(calendarUrl(e))}" target="_blank" rel="noopener">加入行事曆</a>`);

    return `<article class="card ${closing ? 'closing' : ''}">
      <div class="badges">${badges.join('')}</div>
      <h3>${esc(e.title)}</h3>
      ${e.summary ? `<p class="summary">${esc(e.summary)}</p>` : ''}
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <div class="actions">${actions.join('')}</div>
    </article>`;
  }

  function shortName(name) {
    const m = String(name).replace(/\.pdf$/i, '').match(/[-_－]([^-_－]+)$/);
    return m ? m[1] : '附件';
  }

  function matches(e) {
    if (state.aud !== 'all' && e.audience !== state.aud) return false;
    if (state.tag && e.tags.indexOf(state.tag) === -1) return false;
    if (!state.q) return true;
    const hay = [e.title, e.host, e.location, e.summary, e.course_code, e.tags.join(' ')].join(' ').toLowerCase();
    return state.q.toLowerCase().split(/\s+/).every(word => hay.indexOf(word) !== -1);
  }

  function render() {
    const t = today();
    const visible = state.events
      .filter(e => (e.end || e.start || e.deadline || t) >= t)
      .filter(matches);

    const closing = visible
      .filter(e => e.deadline && e.deadline >= t && days(t, e.deadline) <= CLOSING_DAYS)
      .sort((a, b) => a.deadline.localeCompare(b.deadline));
    const rest = visible.filter(e => closing.indexOf(e) === -1)
      .sort((a, b) => (a.start || '9999').localeCompare(b.start || '9999') || (a.deadline || '').localeCompare(b.deadline || ''));

    let html = '';
    if (closing.length) {
      html += `<h2 class="urgent">${CLOSING_DAYS} 天內截止報名 <small>${closing.length} 場</small></h2>`;
      html += closing.map(e => card(e, t, true)).join('');
    }
    const groups = {};
    rest.forEach(e => {
      const key = e.start ? e.start.slice(0, 7) : 'undated';
      (groups[key] = groups[key] || []).push(e);
    });
    Object.keys(groups).sort().forEach(key => {
      const label = key === 'undated' ? '日期待確認' : `${Number(key.slice(0, 4))} 年 ${Number(key.slice(5))} 月`;
      html += `<h2>${label} <small>${groups[key].length} 場</small></h2>`;
      html += groups[key].map(e => card(e, t, false)).join('');
    });
    $('list').innerHTML = html || '<p class="empty">目前沒有符合條件的研習。</p>';
  }

  function renderTags() {
    const counts = {};
    state.events.forEach(e => e.tags.forEach(tag => { counts[tag] = (counts[tag] || 0) + 1; }));
    const tags = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    $('tags').innerHTML = tags.map(tag =>
      `<button type="button" class="chip" data-tag="${esc(tag)}" aria-pressed="${state.tag === tag}">${esc(tag)}</button>`).join('');
  }

  function setAudience(aud) {
    state.aud = aud;
    store('aud', aud);
    document.querySelectorAll('[data-aud]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.aud === aud)));
    render();
  }

  document.querySelector('.seg').addEventListener('click', ev => {
    const b = ev.target.closest('[data-aud]');
    if (b) setAudience(b.dataset.aud);
  });
  $('tags').addEventListener('click', ev => {
    const b = ev.target.closest('[data-tag]');
    if (!b) return;
    state.tag = state.tag === b.dataset.tag ? '' : b.dataset.tag;
    renderTags();
    render();
  });
  let timer;
  $('q').addEventListener('input', ev => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = ev.target.value.trim(); render(); }, 120);
  });
  $('list').addEventListener('click', ev => {
    const b = ev.target.closest('[data-copy]');
    if (!b || !navigator.clipboard) return;
    navigator.clipboard.writeText(b.dataset.copy).then(() => {
      b.textContent = '已複製';
      setTimeout(() => { b.textContent = '複製'; }, 1500);
    });
  });

  setAudience(store('aud') || 'teacher');

  fetch('events.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      state.events = (data.events || []).map(e => Object.assign({ tags: [], attachments: [] }, e));
      const at = data.generated_at ? new Date(data.generated_at) : null;
      $('updated').textContent = at
        ? `資料更新：${at.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}・共 ${state.events.length} 場`
        : `共 ${state.events.length} 場`;
      renderTags();
      render();
    })
    .catch(() => {
      $('updated').textContent = '';
      $('list').innerHTML = '<p class="status">資料載入失敗，請稍後重新整理。</p>';
    });
})();
</script>
</body>
</html>
